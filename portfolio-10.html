<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENTHOUSE WARSZAWA - Loft Kolasiński</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="text-2xl font-light">Loft Kolasiński</a>
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html" class="hover:text-gray-600">Strona główna</a>
                    <a href="index.html#projekty" class="hover:text-gray-600">Projekty</a>
                    <a href="index.html#o-nas" class="hover:text-gray-600">O nas</a>
                    <a href="index.html#kontakt" class="hover:text-gray-600">Kontakt</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="pt-20">
        <!-- Hero Image -->
        <div class="relative w-full h-[60vh] overflow-hidden">
            <img src="https://d2vzorxxgdhozt.cloudfront.net/wp-content/uploads/2023/05/okladka_t-600x403.jpg" alt="PENTHOUSE WARSZAWA" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
                <div class="text-center text-white">
                    <h1 class="text-5xl md:text-7xl font-light mb-4">PENTHOUSE WARSZAWA</h1>
                    <p class="text-xl">Warszawa</p>
                </div>
            </div>
        </div>

        <!-- Project Info -->
        <section class="py-16 bg-white">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="mb-8">
                    <a href="index.html" class="text-gray-600 hover:text-black transition-colors inline-flex items-center mb-8">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        Powrót do projektów
                    </a>
                    
                    <div class="flex flex-wrap gap-4 mb-8 text-sm text-gray-600">
                        <span class="px-4 py-2 bg-gray-100 rounded">Projekty wnętrz</span>
                        <span class="px-4 py-2 bg-gray-100 rounded">Warszawa</span>
                        <span class="px-4 py-2 bg-gray-100 rounded">2023</span>
                    </div>

                    <div class="prose max-w-none">
                        <p class="text-lg text-gray-700 leading-relaxed">
                            Luksusowy penthouse w Warszawie z panoramicznym widokiem na miasto. Nowoczesny design z najwyższej jakości materiałami.
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Image Gallery -->
        <section class="py-8 bg-gray-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <h2 class="text-3xl font-light mb-8 text-center">Galeria</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                        <div class="relative aspect-[4/3] overflow-hidden bg-gray-100 group cursor-pointer">
                            <img src="https://d2vzorxxgdhozt.cloudfront.net/wp-content/uploads/2023/05/okladka_t-600x403.jpg" alt="PENTHOUSE WARSZAWA - Obraz 1" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                        </div>
                    
                </div>
            </div>
        </section>

        <!-- Navigation to other projects -->
        <section class="py-16 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center">
                    <a href="index.html" class="inline-block px-8 py-4 bg-black text-white hover:bg-gray-800 transition-colors">
                        Zobacz wszystkie projekty
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
