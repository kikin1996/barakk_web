<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barakk.cz - návrhy interiérů a nábytku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1f2937 0%, #111827 100%); }
    </style>
    <link rel="icon" type="image/jpeg" href="public/favicon.jpg">
</head>
<body class="bg-white">
    <!-- Top Bar -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-10">
                <nav class="flex items-center space-x-4 text-gray-600">
                    <a href="https://www.instagram.com/barakk.cz/" class="hover:text-gray-900" aria-label="Instagram">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Zm0-2a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h10a5 5 0 0 0 5-5V7a5 5 0 0 0-5-5H7Zm5 7.6A3.4 3.4 0 1 0 15.4 13 3.41 3.41 0 0 0 12 9.6Zm0-2A5.4 5.4 0 1 1 6.6 13 5.4 5.4 0 0 1 12 7.6Zm4.75-1.85a1.05 1.05 0 1 0 1.05 1.05 1.05 1.05 0 0 0-1.05-1.05Z"/></svg>
                    </a>
                </nav>
                <div class="flex items-center space-x-2"></div>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="fixed top-10 left-0 right-0 z-40 bg-white/95 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="/" class="flex items-center">
                    <img src="public/images/logo.jpg" alt="Barakk" class="h-12 object-contain" />
                </a>
                <nav class="hidden lg:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-black text-sm font-medium">Home</a>
                    <a href="#portfolioGrid" class="text-gray-700 hover:text-black text-sm font-medium">Naše projekty</a>
                    <a href="onas.html" class="text-gray-700 hover:text-black text-sm font-medium">O nás</a>
                    <a href="kontakt.html" class="text-gray-700 hover:text-black text-sm font-medium">Kontakt</a>
                </nav>
                <button class="lg:hidden flex flex-col justify-center items-center w-8 h-8 space-y-1.5" id="menuToggle">
                    <span class="block w-6 h-0.5 bg-black"></span>
                    <span class="block w-6 h-0.5 bg-black"></span>
                    <span class="block w-6 h-0.5 bg-black"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="pt-30">
        <div class="relative w-full h-screen overflow-hidden">
            <div class="gradient-bg w-full h-full flex items-center justify-center bg-cover bg-center transition-all duration-1000">
                <h1 class="text-6xl md:text-8xl font-light text-white drop-shadow-lg">Barakk studio</h1>
            </div>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 animate-bounce">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                </svg>
            </div>
        </div>

        <!-- Portfolio Section -->
        <section class="py-20 bg-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="mb-12 text-center">
                    <h2 class="text-4xl font-light text-gray-900 mb-4">Naše projekty</h2>
                    <p class="text-gray-600 max-w-2xl mx-auto">Objevte naši kolekci výjimečných interiérových projektů</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="portfolioGrid">
                    <!-- Portfolio items budou naplněny JavaScriptem -->
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-white mt-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="space-y-4">
                <h3 class="text-lg font-semibold tracking-wide">Menu</h3>
                <nav class="flex flex-col space-y-2 text-sm text-gray-200">
                    <a href="#portfolioGrid" class="hover:text-white">Naše projekty</a>
                    <a href="#" class="hover:text-white">Video</a>
                    <a href="onas.html" class="hover:text-white">O nás</a>
                    <a href="kontakt.html" class="hover:text-white">Kontakt</a>
                </nav>
            </div>
            <div class="space-y-4">
                <h3 class="text-lg font-semibold tracking-wide">Kontakt</h3>
                <p class="text-sm text-gray-200 leading-relaxed">
                    F. Čejky 450<br>
                    Frýdek-Místek<br>
                    738 01<br>
                    <a href="mailto:info@barakk.cz" class="hover:text-white">info@barakk.cz</a>
                </p>
            </div>
            <div class="space-y-4">
                <h3 class="text-lg font-semibold tracking-wide">Sledujte nás</h3>
                <div class="flex space-x-4 text-sm text-gray-200">
                    <a href="https://www.instagram.com/barakk.cz/" class="hover:text-white">Instagram</a>
                </div>
                <div class="flex items-center space-x-3 text-sm text-gray-200"></div>
            </div>
        </div>
        <div class="border-t border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between text-xs text-gray-400">
                <span>© 2026 Barakk.cz</span>
                <div class="flex space-x-4 mt-2 md:mt-0">
                    <a href="#" class="hover:text-white">Zásady ochrany soukromí</a>
                    <a href="#" class="hover:text-white">Cookies</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Portfolio projekty
        const portfolioProjects = [
            { id: 1, title: "Moderní rodinný dům", subtitle: "Čeladná", image: "https://3xel.pl/wp-content/uploads/2023/06/3xel_Pogonowskiego_©_ONI_Studio_8885-3-scaled.jpg", category: "Projekty interiérů" },
            { id: 2, title: "Luxusní apartmán", subtitle: "Frýdlant nad Ostravicí", image: "https://3xel.pl/wp-content/uploads/2023/06/3XEL-PORA©-Essen-10-scaled.jpg", category: "Projekty interiérů" },
            { id: 3, title: "Moderní byt", subtitle: "Ostrava", image: "https://3xel.pl/wp-content/uploads/2023/06/3xel_Sokolska_©_ONI_Studio_32026-17-scaled.jpg", category: "Projekty interiérů" },
            { id: 4, title: "Elegantní byt", subtitle: "Opava", image: "https://3xel.pl/wp-content/uploads/2024/10/3XEL-PORA©-P44-14-scaled.jpg", category: "Projekty interiérů" }
        ];

        // Naplnit portfolio grid s klikatelnými odkazy
        const portfolioGrid = document.getElementById('portfolioGrid');
        if (portfolioGrid) {
            portfolioProjects.forEach(item => {
                const link = document.createElement('a');
                link.href = `portfolio-${item.id}.html`;
                link.className = 'group relative overflow-hidden bg-gray-100 aspect-[4/3] cursor-pointer block';
                link.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" loading="lazy" />
                    <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-40 transition-opacity duration-300"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-6 text-white opacity-0 group-hover:opacity-100 transition-all duration-300 translate-y-4 group-hover:translate-y-0">
                        <h3 class="text-xl font-medium mb-1">${item.title}</h3>
                        <p class="text-sm text-gray-300 mb-2">${item.subtitle || ''}</p>
                        <p class="text-sm text-gray-300">${item.category}</p>
                    </div>
                `;
                portfolioGrid.appendChild(link);
            });
        }

        // Hero slider obrázky
        const heroImages = [
            "https://3xel.pl/wp-content/uploads/2023/06/3xel_Pogonowskiego_©_ONI_Studio_8885-3.jpg",
            "https://3xel.pl/wp-content/uploads/2023/06/3XEL-PORA©-Essen-10.jpg",
            "https://3xel.pl/wp-content/uploads/2023/06/3xel_Sokolska_©_ONI_Studio_32026-17.jpg",
            "https://3xel.pl/wp-content/uploads/2024/10/3XEL-PORA©-P44-14.jpg"
        ];

        // Aktualizovat hero sekci s obrázky
        const heroSection = document.querySelector('.gradient-bg');
        if (heroSection) {
            let currentHeroIndex = 0;
            heroSection.style.backgroundImage = `url(${heroImages[0]})`;
            heroSection.style.backgroundSize = 'cover';
            heroSection.style.backgroundPosition = 'center';
            
            setInterval(() => {
                currentHeroIndex = (currentHeroIndex + 1) % heroImages.length;
                heroSection.style.backgroundImage = `url(${heroImages[currentHeroIndex]})`;
            }, 5000);
        }

        // Mobile menu toggle
        document.getElementById('menuToggle')?.addEventListener('click', function() {
            console.log('Menu clicked');
        });
    </script>
</body>
</html>
